<!--
    ConnectPro Shared Error States
    File: frontend/components/shared/error-state.html

    Usage:
    1. Load this file once with the shared component loader.
    2. Clone the required template.
    3. Set the title, message, error code, and action handlers.
-->

<!-- Generic application error -->
<template id="errorStateTemplate">
    <section
        class="cp-error-state cp-glass-panel"
        data-error-state
        role="alert"
        aria-live="assertive"
    >
        <div class="cp-error-state__icon cp-error-state__icon--danger" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 7v6M12 17h.01"></path>
            </svg>
        </div>

        <div class="cp-error-state__content">
            <p class="cp-error-state__eyebrow">เกิดข้อผิดพลาด</p>
            <h2 data-error-title>ไม่สามารถดำเนินการได้</h2>
            <p data-error-message>
                ระบบไม่สามารถดำเนินการตามคำขอได้ กรุณาลองใหม่อีกครั้ง
            </p>
            <p class="cp-error-state__code" data-error-code-container hidden>
                รหัสข้อผิดพลาด:
                <code data-error-code>UNKNOWN_ERROR</code>
            </p>
        </div>

        <div class="cp-error-state__actions">
            <button type="button" class="cp-button cp-button--primary" data-error-retry>
                ลองใหม่
            </button>
            <button type="button" class="cp-button cp-button--secondary" data-error-dismiss>
                ปิดข้อความ
            </button>
        </div>
    </section>
</template>

<!-- Network or API connection error -->
<template id="networkErrorStateTemplate">
    <section
        class="cp-error-state cp-glass-panel"
        data-network-error-state
        role="alert"
        aria-live="assertive"
    >
        <div class="cp-error-state__icon cp-error-state__icon--warning" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12.5a10 10 0 0 1 14 0"></path>
                <path d="M8.5 16a5 5 0 0 1 7 0"></path>
                <path d="M12 20h.01"></path>
                <path d="m3 3 18 18"></path>
            </svg>
        </div>

        <div class="cp-error-state__content">
            <p class="cp-error-state__eyebrow">การเชื่อมต่อขัดข้อง</p>
            <h2>ไม่สามารถเชื่อมต่อกับระบบได้</h2>
            <p data-error-message>
                กรุณาตรวจสอบเครือข่าย VPN หรือการเชื่อมต่ออินเทอร์เน็ต แล้วลองอีกครั้ง
            </p>
        </div>

        <div class="cp-error-state__actions">
            <button type="button" class="cp-button cp-button--primary" data-error-retry>
                ตรวจสอบอีกครั้ง
            </button>
            <button type="button" class="cp-button cp-button--secondary" data-error-reload>
                โหลดหน้าใหม่
            </button>
        </div>
    </section>
</template>

<!-- Authentication session expired -->
<template id="sessionExpiredErrorStateTemplate">
    <section
        class="cp-error-state cp-glass-panel"
        data-session-expired-error-state
        role="alert"
        aria-live="assertive"
    >
        <div class="cp-error-state__icon cp-error-state__icon--warning" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 7v5l3 2"></path>
                <path d="M18.5 5.5 21 3"></path>
            </svg>
        </div>

        <div class="cp-error-state__content">
            <p class="cp-error-state__eyebrow">Session หมดอายุ</p>
            <h2>กรุณาเข้าสู่ระบบอีกครั้ง</h2>
            <p>
                Session ถูกปิดเพื่อความปลอดภัย ข้อมูลที่ยังไม่ได้บันทึกอาจสูญหาย
            </p>
        </div>

        <div class="cp-error-state__actions">
            <a class="cp-button cp-button--primary" href="/connectpro/frontend/pages/auth/login.html" data-login-link>
                ไปหน้าเข้าสู่ระบบ
            </a>
        </div>
    </section>
</template>

<!-- 403 permission error -->
<template id="forbiddenErrorStateTemplate">
    <section
        class="cp-error-state cp-glass-panel"
        data-forbidden-error-state
        role="alert"
        aria-live="assertive"
    >
        <div class="cp-error-state__icon cp-error-state__icon--warning" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                <path d="M12 14v3"></path>
            </svg>
        </div>

        <div class="cp-error-state__content">
            <p class="cp-error-state__eyebrow">403 Forbidden</p>
            <h2>ไม่มีสิทธิ์ดำเนินการนี้</h2>
            <p data-error-message>
                บัญชีปัจจุบันไม่มี Permission ที่จำเป็น กรุณาติดต่อผู้ดูแลระบบ
            </p>
            <p class="cp-error-state__code" data-required-permission-container hidden>
                Permission ที่ต้องใช้:
                <code data-required-permission>-</code>
            </p>
        </div>

        <div class="cp-error-state__actions">
            <a class="cp-button cp-button--primary" href="/connectpro/frontend/pages/user/dashboard.html">
                กลับหน้า Dashboard
            </a>
            <button type="button" class="cp-button cp-button--secondary" data-error-back>
                ย้อนกลับ
            </button>
        </div>
    </section>
</template>

<!-- 404 resource not found -->
<template id="notFoundErrorStateTemplate">
    <section
        class="cp-error-state cp-glass-panel"
        data-not-found-error-state
        role="status"
        aria-live="polite"
    >
        <div class="cp-error-state__icon cp-error-state__icon--info" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="10" cy="10" r="6"></circle>
                <path d="m15 15 5 5"></path>
                <path d="M8 8h4M8 12h2"></path>
            </svg>
        </div>

        <div class="cp-error-state__content">
            <p class="cp-error-state__eyebrow">404 Not Found</p>
            <h2 data-error-title>ไม่พบข้อมูลที่ต้องการ</h2>
            <p data-error-message>
                ข้อมูลอาจถูกลบ ย้าย หรือ URL ไม่ถูกต้อง
            </p>
        </div>

        <div class="cp-error-state__actions">
            <button type="button" class="cp-button cp-button--primary" data-error-back>
                กลับหน้าก่อนหน้า
            </button>
            <a class="cp-button cp-button--secondary" href="/connectpro/frontend/pages/user/dashboard.html">
                ไปหน้า Dashboard
            </a>
        </div>
    </section>
</template>

<!-- Server error -->
<template id="serverErrorStateTemplate">
    <section
        class="cp-error-state cp-glass-panel"
        data-server-error-state
        role="alert"
        aria-live="assertive"
    >
        <div class="cp-error-state__icon cp-error-state__icon--danger" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="6" rx="2"></rect>
                <rect x="3" y="14" width="18" height="6" rx="2"></rect>
                <path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"></path>
            </svg>
        </div>

        <div class="cp-error-state__content">
            <p class="cp-error-state__eyebrow">Server Error</p>
            <h2>เซิร์ฟเวอร์ไม่สามารถประมวลผลได้</h2>
            <p data-error-message>
                เกิดปัญหาภายในระบบ กรุณารอสักครู่แล้วลองใหม่ หากยังพบปัญหาให้แจ้งผู้ดูแลระบบ
            </p>
            <p class="cp-error-state__code">
                รหัสข้อผิดพลาด:
                <code data-error-code>500</code>
            </p>
        </div>

        <div class="cp-error-state__actions">
            <button type="button" class="cp-button cp-button--primary" data-error-retry>
                ลองใหม่
            </button>
            <button type="button" class="cp-button cp-button--secondary" data-error-copy-reference>
                คัดลอกรหัสอ้างอิง
            </button>
        </div>
    </section>
</template>

<!-- Form validation summary -->
<template id="validationErrorStateTemplate">
    <section
        class="cp-error-state cp-error-state--compact cp-alert cp-alert--danger"
        data-validation-error-state
        role="alert"
        aria-live="assertive"
        tabindex="-1"
    >
        <div class="cp-error-state__content">
            <h2 data-error-title>กรุณาตรวจสอบข้อมูล</h2>
            <p data-error-message>พบข้อมูลไม่ถูกต้อง กรุณาแก้ไขช่องที่ระบุ</p>
            <ul data-validation-error-list></ul>
        </div>
    </section>
</template>

<!-- Inline API error -->
<template id="inlineErrorStateTemplate">
    <div
        class="cp-inline-error"
        data-inline-error-state
        role="alert"
        aria-live="assertive"
    >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v6M12 17h.01"></path>
        </svg>
        <span data-error-message>เกิดข้อผิดพลาด กรุณาลองใหม่</span>
        <button type="button" class="cp-button cp-button--text cp-button--small" data-error-retry hidden>
            ลองใหม่
        </button>
    </div>
</template>

<!-- Static fallback for modules that directly toggle one element -->
<section
    class="cp-error-state cp-glass-panel"
    data-shared-error-state
    role="alert"
    aria-live="assertive"
    hidden
>
    <div class="cp-error-state__icon cp-error-state__icon--danger" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v6M12 17h.01"></path>
        </svg>
    </div>

    <div class="cp-error-state__content">
        <h2 data-error-title>เกิดข้อผิดพลาด</h2>
        <p data-error-message>ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่อีกครั้ง</p>
    </div>

    <div class="cp-error-state__actions">
        <button type="button" class="cp-button cp-button--primary" data-error-retry>
            ลองใหม่
        </button>
    </div>
</section>
