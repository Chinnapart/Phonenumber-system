<!--
    ConnectPro Shared Contact Detail Modal
    File: frontend/components/shared/contact-detail-modal.html

    Compatible JavaScript:
    - assets/js/core/components.js
    - assets/js/admin/contacts.js
    - assets/js/user/contacts.js
    - assets/js/user/contact-detail.js
-->

<template id="contactDetailModalTemplate">
    <section
        class="cp-contact-detail-modal"
        data-contact-detail-modal
        aria-label="รายละเอียดผู้ติดต่อ"
    >
        <header class="cp-contact-detail-modal__profile">
            <span
                class="cp-glass-avatar cp-contact-detail-modal__avatar"
                data-contact-avatar
                aria-hidden="true"
            >?</span>

            <div class="cp-contact-detail-modal__identity">
                <h2 data-contact-field="displayName">ไม่ระบุชื่อ</h2>
                <p>
                    รหัสพนักงาน:
                    <span data-contact-field="employeeCode">-</span>
                </p>

                <div class="cp-contact-detail-modal__badges">
                    <span
                        class="cp-badge cp-badge--info"
                        data-contact-field="departmentName"
                    >-</span>
                    <span
                        class="cp-badge cp-badge--neutral"
                        data-contact-field="locationName"
                    >-</span>
                </div>
            </div>

            <button
                type="button"
                class="cp-favorite-button cp-contact-detail-modal__favorite"
                data-contact-favorite
                aria-pressed="false"
                aria-label="เพิ่มในรายการโปรด"
            >
                <span aria-hidden="true">☆</span>
                <span data-favorite-label>เพิ่มรายการโปรด</span>
            </button>
        </header>

        <div
            class="cp-alert cp-alert--danger"
            data-contact-detail-error
            role="alert"
            hidden
        ></div>

        <div
            class="cp-contact-detail-modal__loading"
            data-contact-detail-loading
            role="status"
            aria-live="polite"
            hidden
        >
            <span class="cp-spinner" aria-hidden="true"></span>
            <span>กำลังโหลดข้อมูลผู้ติดต่อ...</span>
        </div>

        <div class="cp-contact-detail-modal__body" data-contact-detail-content>
            <section
                class="cp-contact-detail-modal__section"
                aria-labelledby="contactCommunicationHeading"
            >
                <h3 id="contactCommunicationHeading">ข้อมูลการติดต่อ</h3>

                <dl class="cp-contact-detail-list">
                    <div class="cp-contact-detail-list__row">
                        <dt>เบอร์ต่อ</dt>
                        <dd data-contact-field="extensionNumber">-</dd>
                        <div class="cp-contact-detail-list__actions">
                            <button
                                type="button"
                                class="cp-icon-button"
                                data-copy-contact="extensionNumber"
                                data-copy-value=""
                                aria-label="คัดลอกเบอร์ต่อ"
                                disabled
                            >
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <rect x="9" y="9" width="11" height="11" rx="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="cp-contact-detail-list__row">
                        <dt>โทรศัพท์มือถือ</dt>
                        <dd data-contact-field="mobileNumber">-</dd>
                        <div class="cp-contact-detail-list__actions">
                            <button
                                type="button"
                                class="cp-icon-button"
                                data-copy-contact="mobileNumber"
                                data-copy-value=""
                                aria-label="คัดลอกเบอร์โทรศัพท์มือถือ"
                                disabled
                            >
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <rect x="9" y="9" width="11" height="11" rx="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="cp-contact-detail-list__row">
                        <dt>อีเมล</dt>
                        <dd data-contact-field="email">-</dd>
                        <div class="cp-contact-detail-list__actions">
                            <button
                                type="button"
                                class="cp-icon-button"
                                data-copy-contact="email"
                                data-copy-value=""
                                aria-label="คัดลอกอีเมล"
                                disabled
                            >
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <rect x="9" y="9" width="11" height="11" rx="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </dl>
            </section>

            <section
                class="cp-contact-detail-modal__section"
                aria-labelledby="contactOrganizationHeading"
            >
                <h3 id="contactOrganizationHeading">ข้อมูลองค์กร</h3>

                <dl class="cp-contact-detail-list">
                    <div class="cp-contact-detail-list__row">
                        <dt>ตำแหน่ง</dt>
                        <dd data-contact-field="position">-</dd>
                    </div>

                    <div class="cp-contact-detail-list__row">
                        <dt>แผนก</dt>
                        <dd data-contact-field="departmentName">-</dd>
                    </div>

                    <div class="cp-contact-detail-list__row">
                        <dt>สถานที่</dt>
                        <dd data-contact-field="locationName">-</dd>
                    </div>
                </dl>
            </section>

            <section
                class="cp-contact-detail-modal__section"
                aria-labelledby="contactNetworkHeading"
            >
                <h3 id="contactNetworkHeading">ข้อมูลเครือข่าย</h3>

                <dl class="cp-contact-detail-list">
                    <div class="cp-contact-detail-list__row">
                        <dt>IP Address</dt>
                        <dd data-contact-field="ipAddress">-</dd>
                        <div class="cp-contact-detail-list__actions">
                            <button
                                type="button"
                                class="cp-icon-button"
                                data-copy-contact="ipAddress"
                                data-copy-value=""
                                aria-label="คัดลอก IP Address"
                                disabled
                            >
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <rect x="9" y="9" width="11" height="11" rx="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="cp-contact-detail-list__row">
                        <dt>อัปเดตล่าสุด</dt>
                        <dd data-contact-field="updatedAt">-</dd>
                    </div>
                </dl>
            </section>
        </div>

        <footer class="cp-contact-detail-modal__footer">
            <button
                type="button"
                class="cp-button cp-button--secondary"
                data-modal-close
            >
                ปิด
            </button>

            <a
                class="cp-button cp-button--primary"
                href="#"
                data-contact-detail-page-link
            >
                ดูหน้าแบบเต็ม
            </a>

            <button
                type="button"
                class="cp-button cp-button--secondary"
                data-contact-edit
                data-permission="contacts.update"
                data-role="admin"
            >
                แก้ไขข้อมูล
            </button>
        </footer>
    </section>
</template>
