<!--
    ConnectPro Shared Notification Components
    File: frontend/components/shared/notification.html

    Compatible JavaScript:
    - assets/js/core/components.js
    - assets/js/core/notifications.js

    Load this file once with the shared component loader, then clone the
    required template or use the static notification region directly.
-->

<!-- Notification dropdown panel -->
<template id="notificationDropdownTemplate">
    <section
        class="cp-dropdown-menu cp-notification-menu"
        data-notification-menu
        aria-label="การแจ้งเตือน"
        hidden
    >
        <header class="cp-notification-menu__header">
            <div>
                <h2>การแจ้งเตือน</h2>
                <p>
                    ยังไม่ได้อ่าน
                    <strong data-notification-count-text>0</strong>
                    รายการ
                </p>
            </div>

            <button
                type="button"
                class="cp-button cp-button--text cp-button--small"
                data-notification-read-all
                disabled
            >
                อ่านทั้งหมด
            </button>
        </header>

        <div
            class="cp-notification-menu__loading"
            data-notification-loading
            role="status"
            aria-live="polite"
            hidden
        >
            <span class="cp-spinner" aria-hidden="true"></span>
            <span>กำลังโหลดการแจ้งเตือน...</span>
        </div>

        <div
            class="cp-alert cp-alert--danger"
            data-notification-error
            role="alert"
            hidden
        ></div>

        <div
            class="cp-notification-menu__list"
            data-notification-list
            aria-live="polite"
            aria-relevant="additions text"
        ></div>

        <div
            class="cp-notification-menu__empty"
            data-notification-empty
            role="status"
        >
            <div class="cp-notification-menu__empty-icon" aria-hidden="true">
                <svg
                    viewBox="0 0 24 24"
                    width="38"
                    height="38"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                    <path d="M10 21h4"></path>
                </svg>
            </div>
            <p>ยังไม่มีการแจ้งเตือน</p>
            <small>รายการใหม่จาก ConnectPro จะแสดงที่นี่</small>
        </div>

        <footer class="cp-notification-menu__footer">
            <a href="/connectpro/frontend/pages/user/notifications.html">
                ดูการแจ้งเตือนทั้งหมด
            </a>
        </footer>
    </section>
</template>

<!-- Individual notification item -->
<template id="notificationItemTemplate">
    <article
        class="cp-notification-item"
        data-notification-item
        data-notification-id=""
    >
        <button
            type="button"
            class="cp-notification-item__main"
            data-notification-open
        >
            <span
                class="cp-notification-item__icon cp-notification-item__icon--info"
                data-notification-icon
                aria-hidden="true"
            >
                <svg
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M12 11v5M12 8h.01"></path>
                </svg>
            </span>

            <span class="cp-notification-item__content">
                <span class="cp-notification-item__title" data-notification-title>
                    การแจ้งเตือนใหม่
                </span>
                <span class="cp-notification-item__message" data-notification-message>
                    มีรายการใหม่ในระบบ
                </span>
                <time
                    class="cp-notification-item__time"
                    datetime=""
                    data-notification-time
                >
                    เมื่อสักครู่
                </time>
            </span>

            <span
                class="cp-notification-item__unread"
                data-notification-unread-indicator
                aria-label="ยังไม่ได้อ่าน"
            ></span>
        </button>

        <div class="cp-notification-item__actions">
            <button
                type="button"
                class="cp-icon-button"
                data-notification-read
                aria-label="ทำเครื่องหมายว่าอ่านแล้ว"
                title="อ่านแล้ว"
            >
                <svg
                    viewBox="0 0 24 24"
                    width="17"
                    height="17"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="m5 12 4 4L19 6"></path>
                </svg>
            </button>

            <button
                type="button"
                class="cp-icon-button cp-icon-button--danger"
                data-notification-delete
                aria-label="ลบการแจ้งเตือน"
                title="ลบ"
            >
                <svg
                    viewBox="0 0 24 24"
                    width="17"
                    height="17"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M3 6h18"></path>
                    <path d="M8 6V4h8v2"></path>
                    <path d="M19 6 18 21H6L5 6"></path>
                    <path d="M10 11v5M14 11v5"></path>
                </svg>
            </button>
        </div>
    </article>
</template>

<!-- Notification page shell -->
<template id="notificationPageTemplate">
    <section
        class="cp-notification-page cp-glass-panel"
        data-notification-page
        aria-labelledby="notificationPageHeading"
    >
        <header class="cp-notification-page__header">
            <div>
                <h2 id="notificationPageHeading">การแจ้งเตือนทั้งหมด</h2>
                <p>
                    พบทั้งหมด
                    <strong data-notification-total>0</strong>
                    รายการ
                </p>
            </div>

            <div class="cp-notification-page__actions">
                <button
                    type="button"
                    class="cp-button cp-button--secondary"
                    data-notification-refresh
                >
                    รีเฟรช
                </button>

                <button
                    type="button"
                    class="cp-button cp-button--primary"
                    data-notification-read-all
                    disabled
                >
                    อ่านทั้งหมด
                </button>
            </div>
        </header>

        <div class="cp-notification-page__filters">
            <label class="cp-form-group">
                <span>สถานะ</span>
                <select class="cp-select" data-notification-status-filter>
                    <option value="">ทั้งหมด</option>
                    <option value="unread">ยังไม่ได้อ่าน</option>
                    <option value="read">อ่านแล้ว</option>
                </select>
            </label>

            <label class="cp-form-group">
                <span>ประเภท</span>
                <select class="cp-select" data-notification-type-filter>
                    <option value="">ทุกประเภท</option>
                    <option value="info">ข้อมูล</option>
                    <option value="success">สำเร็จ</option>
                    <option value="warning">คำเตือน</option>
                    <option value="error">ข้อผิดพลาด</option>
                    <option value="system">ระบบ</option>
                </select>
            </label>
        </div>

        <div
            class="cp-inline-loading"
            data-notification-loading
            role="status"
            aria-live="polite"
            hidden
        >
            <span class="cp-spinner" aria-hidden="true"></span>
            <span>กำลังโหลดการแจ้งเตือน...</span>
        </div>

        <div
            class="cp-alert cp-alert--danger"
            data-notification-error
            role="alert"
            hidden
        ></div>

        <div
            class="cp-notification-page__list"
            data-notification-list
            aria-live="polite"
        ></div>

        <div
            class="cp-empty-state cp-empty-state--compact"
            data-notification-empty
            role="status"
        >
            <div class="cp-empty-state__icon" aria-hidden="true">
                <svg
                    viewBox="0 0 24 24"
                    width="42"
                    height="42"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                    <path d="M10 21h4"></path>
                </svg>
            </div>
            <h3>ยังไม่มีการแจ้งเตือน</h3>
            <p>ลองเปลี่ยนตัวกรอง หรือกลับมาตรวจสอบอีกครั้งภายหลัง</p>
        </div>

        <footer class="cp-notification-page__footer">
            <span data-notification-page-summary aria-live="polite">
                0-0 จาก 0
            </span>
            <nav
                class="cp-pagination"
                data-notification-pagination
                aria-label="เปลี่ยนหน้าการแจ้งเตือน"
            ></nav>
        </footer>
    </section>
</template>

<!-- Toast notification -->
<template id="notificationToastTemplate">
    <article
        class="cp-toast cp-toast--info"
        data-notification-toast
        role="status"
        aria-live="polite"
    >
        <span class="cp-toast__icon" data-toast-icon aria-hidden="true">
            <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 11v5M12 8h.01"></path>
            </svg>
        </span>

        <div class="cp-toast__content">
            <strong data-toast-title>การแจ้งเตือน</strong>
            <p data-toast-message>มีรายการใหม่ในระบบ</p>
        </div>

        <button
            type="button"
            class="cp-toast__close cp-icon-button"
            data-toast-close
            aria-label="ปิดการแจ้งเตือน"
        >
            <svg
                viewBox="0 0 24 24"
                width="17"
                height="17"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
            >
                <path d="m6 6 12 12M18 6 6 18"></path>
            </svg>
        </button>
    </article>
</template>

<!-- Notification badge -->
<template id="notificationBadgeTemplate">
    <span
        class="cp-notification-badge"
        data-notification-count
        aria-label="ไม่มีการแจ้งเตือนที่ยังไม่ได้อ่าน"
        hidden
    >0</span>
</template>

<!-- Static live region used by notifications.js and assistive technology -->
<div
    class="cp-notification-live-region cp-visually-hidden"
    data-notification-live-region
    role="status"
    aria-live="polite"
    aria-atomic="true"
></div>

<!-- Toast host. New toast elements should be appended here. -->
<div
    class="cp-toast-container"
    data-toast-container
    aria-label="ข้อความแจ้งเตือนจากระบบ"
></div>
