<!--
    ConnectPro Shared Empty States
    File: frontend/components/shared/empty-state.html

    Usage:
    1. Load this component file once.
    2. Clone the required template.
    3. Update title, message, and action attributes when needed.
-->

<!-- Generic empty state -->
<template id="emptyStateTemplate">
    <section
        class="cp-empty-state cp-glass-panel"
        data-empty-state
        role="status"
        aria-live="polite"
    >
        <div class="cp-empty-state__icon" aria-hidden="true">
            <svg
                viewBox="0 0 24 24"
                width="48"
                height="48"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M4 6h16v12H4z"></path>
                <path d="M8 10h8M8 14h5"></path>
            </svg>
        </div>

        <div class="cp-empty-state__content">
            <h2 data-empty-state-title>ยังไม่มีข้อมูล</h2>
            <p data-empty-state-message>
                ข้อมูลจะแสดงในส่วนนี้เมื่อมีรายการในระบบ
            </p>
        </div>

        <div class="cp-empty-state__actions" data-empty-state-actions hidden>
            <button
                type="button"
                class="cp-button cp-button--primary"
                data-empty-state-primary-action
            >
                เริ่มต้นใช้งาน
            </button>

            <button
                type="button"
                class="cp-button cp-button--secondary"
                data-empty-state-secondary-action
                hidden
            >
                กลับหน้าหลัก
            </button>
        </div>
    </section>
</template>

<!-- No search results -->
<template id="searchEmptyStateTemplate">
    <section
        class="cp-empty-state cp-glass-panel"
        data-search-empty-state
        role="status"
        aria-live="polite"
    >
        <div class="cp-empty-state__icon cp-empty-state__icon--search" aria-hidden="true">
            <svg
                viewBox="0 0 24 24"
                width="48"
                height="48"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <circle cx="10.5" cy="10.5" r="6.5"></circle>
                <path d="m16 16 5 5"></path>
                <path d="M8 9h5M8 12h3"></path>
            </svg>
        </div>

        <div class="cp-empty-state__content">
            <h2 data-empty-state-title>ไม่พบผลการค้นหา</h2>
            <p data-empty-state-message>
                ลองเปลี่ยนคำค้นหา ตัวกรอง หรือรีเซ็ตเงื่อนไขแล้วค้นหาอีกครั้ง
            </p>
            <p class="cp-empty-state__query" data-empty-state-query hidden>
                คำค้นหา: <strong data-empty-state-query-value></strong>
            </p>
        </div>

        <div class="cp-empty-state__actions">
            <button
                type="button"
                class="cp-button cp-button--secondary"
                data-empty-state-reset
                data-contacts-reset
                data-departments-reset
                data-users-reset
                data-activity-log-reset
            >
                รีเซ็ตตัวกรอง
            </button>
        </div>
    </section>
</template>

<!-- No contacts -->
<template id="contactsEmptyStateTemplate">
    <section
        class="cp-empty-state cp-glass-panel"
        data-contacts-empty
        role="status"
        aria-live="polite"
    >
        <div class="cp-empty-state__icon cp-empty-state__icon--contacts" aria-hidden="true">
            <svg
                viewBox="0 0 24 24"
                width="48"
                height="48"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <circle cx="9" cy="8" r="4"></circle>
                <path d="M2 21a7 7 0 0 1 14 0"></path>
                <path d="M17 9h5M19.5 6.5v5"></path>
            </svg>
        </div>

        <div class="cp-empty-state__content">
            <h2>ยังไม่มีรายชื่อผู้ติดต่อ</h2>
            <p>
                เพิ่มผู้ติดต่อใหม่ หรือนำเข้าข้อมูลเพื่อเริ่มใช้งานสมุดรายชื่อ
            </p>
        </div>

        <div class="cp-empty-state__actions" data-role="admin">
            <button
                type="button"
                class="cp-button cp-button--primary"
                data-contact-add
                data-permission="contacts.create"
            >
                เพิ่มผู้ติดต่อ
            </button>

            <a
                class="cp-button cp-button--secondary"
                href="/connectpro/frontend/pages/admin/import-export.html"
                data-permission="contacts.import"
            >
                นำเข้าข้อมูล
            </a>
        </div>
    </section>
</template>

<!-- Error state with retry -->
<template id="errorEmptyStateTemplate">
    <section
        class="cp-empty-state cp-glass-panel cp-empty-state--error"
        data-error-empty-state
        role="alert"
    >
        <div class="cp-empty-state__icon cp-empty-state__icon--error" aria-hidden="true">
            <svg
                viewBox="0 0 24 24"
                width="48"
                height="48"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M12 3 2.5 20h19L12 3Z"></path>
                <path d="M12 9v5M12 17h.01"></path>
            </svg>
        </div>

        <div class="cp-empty-state__content">
            <h2 data-empty-state-title>โหลดข้อมูลไม่สำเร็จ</h2>
            <p data-empty-state-message>
                เกิดข้อผิดพลาดระหว่างโหลดข้อมูล กรุณาลองใหม่อีกครั้ง
            </p>
        </div>

        <div class="cp-empty-state__actions">
            <button
                type="button"
                class="cp-button cp-button--primary"
                data-empty-state-retry
            >
                ลองใหม่
            </button>
        </div>
    </section>
</template>

            <svg
                viewBox="0 0 24 24"
                width="48"
                height="48"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                <circle cx="12" cy="15" r="1"></circle>

        <div class="cp-empty-state__content">
            <h2>ไม่มีสิทธิ์เข้าถึงข้อมูล</h2>

        <div class="cp-empty-state__actions">
            <a
                class="cp-button cp-button--primary"
                href="/connectpro/frontend/pages/user/dashboard.html"

                กลับหน้า Dashboard

</template>
