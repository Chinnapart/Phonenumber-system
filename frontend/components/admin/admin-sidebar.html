<!--
    ConnectPro Admin Sidebar
    File: frontend/components/admin/admin-sidebar.html

    Compatible JavaScript:
    - assets/js/core/auth.js
    - assets/js/core/components.js
    - assets/js/core/permissions.js
-->

<aside
    id="mainSidebar"
    class="cp-sidebar cp-admin-sidebar cp-glass-panel"
    data-admin-sidebar
    aria-label="เมนูผู้ดูแลระบบ"
    aria-hidden="false"
>
    <header class="cp-sidebar__header">
        <a
            class="cp-sidebar__brand"
            href="/connectpro/frontend/pages/admin/dashboard.html"
            aria-label="ConnectPro Admin Dashboard"
        >
            <span class="cp-sidebar__brand-mark" aria-hidden="true">CP</span>
            <span class="cp-sidebar__brand-content">
                <strong>ConnectPro</strong>
                <small>Administration</small>
            </span>
        </a>

        <button
            type="button"
            class="cp-icon-button cp-only-mobile"
            data-sidebar-close
            aria-label="ปิดเมนูหลัก"
        >
            <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
            >
                <path d="m6 6 12 12M18 6 6 18"></path>
            </svg>
        </button>
    </header>

    <div class="cp-sidebar__body">
        <nav class="cp-sidebar-nav" aria-label="เมนูจัดการระบบ">
            <section class="cp-sidebar-nav__section">
                <h2 class="cp-sidebar-nav__heading">ภาพรวม</h2>

                <a
                    class="cp-sidebar-nav__item"
                    href="/connectpro/frontend/pages/admin/dashboard.html"
                    data-nav-key="admin-dashboard"
                    data-permission="dashboard.view"
                >
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
            </section>

            <section class="cp-sidebar-nav__section">
                <h2 class="cp-sidebar-nav__heading">ข้อมูลหลัก</h2>

                <a
                    class="cp-sidebar-nav__item"
                    href="/connectpro/frontend/pages/admin/contacts.html"
                    data-nav-key="admin-contacts"
                    data-permission="contacts.view"
                >
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="9" cy="8" r="4"></circle>
                        <path d="M2 21a7 7 0 0 1 14 0"></path>
                        <path d="M17 8h5M19.5 5.5v5"></path>
                    </svg>
                    <span>จัดการผู้ติดต่อ</span>
                    <span class="cp-sidebar-nav__badge" data-sidebar-count="contacts" hidden>0</span>
                </a>

                <a
                    class="cp-sidebar-nav__item"
                    href="/connectpro/frontend/pages/admin/departments.html"
                    data-nav-key="admin-departments"
                    data-permission="departments.view"
                >
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M3 21V7l9-4 9 4v14"></path>
                        <path d="M8 10h2M14 10h2M8 14h2M14 14h2M10 21v-3h4v3"></path>
                    </svg>
                    <span>จัดการแผนก</span>
                    <span class="cp-sidebar-nav__badge" data-sidebar-count="departments" hidden>0</span>
                </a>

                <a
                    class="cp-sidebar-nav__item"
                    href="/connectpro/frontend/pages/admin/user-management.html"
                    data-nav-key="admin-users"
                    data-permission="users.view"
                >
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="8" cy="8" r="4"></circle>
                        <path d="M2 21a6 6 0 0 1 12 0"></path>
                        <circle cx="17" cy="9" r="3"></circle>
                        <path d="M15 21a5 5 0 0 1 7 0"></path>
                    </svg>
                    <span>จัดการผู้ใช้งาน</span>
                    <span class="cp-sidebar-nav__badge" data-sidebar-count="users" hidden>0</span>
                </a>
            </section>

            <section class="cp-sidebar-nav__section">
                <h2 class="cp-sidebar-nav__heading">เครื่องมือระบบ</h2>

                <a
                    class="cp-sidebar-nav__item"
                    href="/connectpro/frontend/pages/admin/import-export.html"
                    data-nav-key="admin-import-export"
                    data-permission="contacts.import"
                >
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M12 3v12"></path>
                        <path d="m7 10 5 5 5-5"></path>
                        <path d="M5 21h14"></path>
                    </svg>
                    <span>นำเข้าและส่งออก</span>
                </a>

                <a
                    class="cp-sidebar-nav__item"
                    href="/connectpro/frontend/pages/admin/activity-log.html"
                    data-nav-key="admin-activity-log"
                    data-permission="activity_logs.view"
                >
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 7v5l3 2"></path>
                    </svg>
                    <span>บันทึกกิจกรรม</span>
                </a>

                <a
                    class="cp-sidebar-nav__item"
                    href="/connectpro/frontend/pages/admin/settings.html"
                    data-nav-key="admin-settings"
                    data-permission="settings.view"
                >
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.1.4.3.7.6 1 .3.3.7.4 1.1.4h.1v4h-.1a1.7 1.7 0 0 0-1.7.6Z"></path>
                    </svg>
                    <span>ตั้งค่าระบบ</span>
                </a>
            </section>

            <section class="cp-sidebar-nav__section">
                <h2 class="cp-sidebar-nav__heading">ทางลัด</h2>

                <a
                    class="cp-sidebar-nav__item"
                    href="/connectpro/frontend/pages/user/dashboard.html"
                    data-nav-key="user-dashboard"
                >
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M3 12h18"></path>
                        <path d="m14 5 7 7-7 7"></path>
                    </svg>
                    <span>ไปหน้าผู้ใช้งาน</span>
                </a>
            </section>
        </nav>
    </div>

    <footer class="cp-sidebar__footer">
        <div class="cp-sidebar-user">
            <span
                class="cp-glass-avatar cp-sidebar-user__avatar"
                data-user-initials
                aria-hidden="true"
            >?</span>

            <div class="cp-sidebar-user__identity">
                <strong data-user-field="displayName">ผู้ดูแลระบบ</strong>
                <small data-user-field="roleName">Administrator</small>
            </div>

            <button
                type="button"
                class="cp-icon-button cp-sidebar-user__logout"
                data-logout
                aria-label="ออกจากระบบ"
                title="ออกจากระบบ"
            >
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="M10 17l5-5-5-5"></path>
                    <path d="M15 12H3"></path>
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                </svg>
            </button>
        </div>

        <p class="cp-sidebar__version">
            ConnectPro <span data-app-version>v1.0.0</span>
        </p>
    </footer>
</aside>

<div
    class="cp-sidebar-backdrop"
    data-sidebar-backdrop
    aria-hidden="true"
    hidden
></div>
